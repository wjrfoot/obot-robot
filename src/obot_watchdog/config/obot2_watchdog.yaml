# OBot-2 watchdog parameters. Fault recovery is enabled with bounded retries.
obot2_watchdog:
  ros__parameters:
    # Robot-specific hardware (OBot-1 uses node IDs 0 and 1 - do not copy).
    robot_name: OBot-2
    can_interface: can0
    can_bitrate: 1000000
    left_node_id: 61
    right_node_id: 62

    monitor_interval: 1.0
    telemetry_stale_s: 2.0
    get_error_miss_limit: 5
    max_recoveries: 3
    retry_interval_s: 5.0
    verify_timeout_s: 3.0
    command_gap_s: 0.5

    notification_topic: /obot/watchdog_event

    dry_run: false

    # Recoverable: DC_BUS_OVER_VOLTAGE (0x100) and
    # BRAKE_RESISTOR_DISARMED (0x08000000).
    # DC_BUS_UNDER_VOLTAGE (0x200) remains excluded.
    recoverable_error_mask: 134218496

    fault_log_path: /home/pi/obot_logs/obot2_watchdog_faults.jsonl
